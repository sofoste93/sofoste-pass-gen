name: Release cross-platform apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: Aurora-Vault-Windows-x64
            windows: true
          - os: ubuntu-latest
            rid: linux-x64
            asset: Aurora-Vault-Linux-x64
            windows: false
          - os: macos-15-intel
            rid: osx-x64
            asset: Aurora-Vault-macOS-x64
            windows: false
          - os: macos-14
            rid: osx-arm64
            asset: Aurora-Vault-macOS-arm64
            windows: false
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package Windows
        if: matrix.windows
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime ${{ matrix.rid }}
      - name: Sign Windows executable when a certificate is configured
        if: matrix.windows && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'aurora-vault.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD artifacts/Aurora-Vault-win-x64/AuroraVault.exe
          Remove-Item -LiteralPath $certificate -Force
      - name: Archive Windows
        if: matrix.windows
        shell: pwsh
        run: Compress-Archive -Path artifacts/Aurora-Vault-${{ matrix.rid }} -DestinationPath ${{ matrix.asset }}.zip
      - name: Package Unix
        if: ${{ !matrix.windows }}
        run: bash scripts/package.sh ${{ matrix.rid }}
      - name: Archive Unix
        if: ${{ !matrix.windows }}
        run: tar -C artifacts -czf ${{ matrix.asset }}.tar.gz Aurora-Vault-${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Add portable web app
        run: cd web && zip -r ../release/Aurora-Vault-Web-PWA.zip .
      - name: Create checksums
        run: cd release && sha256sum Aurora-Vault-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Aurora Vault 2.0.0 · First Light
          body: |
            ## Strong passwords, quietly generated 🌌

            Aurora Vault transforms the original Java console generator into a private desktop studio and an installable mobile PWA. Generation stays on the device with Java SecureRandom or Web Crypto.

            ### First Light systems
            - Self-contained Windows, Linux and macOS applications
            - Installable offline PWA for Android and iPhone
            - English and German interface
            - Character controls, ambiguity filter and entropy feedback
            - CLI mode and commented learning architecture

            Extract the desktop archive and launch AuroraVault. No Java installation is required.
          files: release/*
          fail_on_unmatched_files: true
